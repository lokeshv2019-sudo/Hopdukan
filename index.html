s<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopDukan - भारत का रेट कार्ड</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header (ऊपर का हिस्सा) -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0">
        <h1 class="text-2xl font-bold text-blue-600">HopDukan</h1>
        <button class="text-sm font-medium border px-3 py-1 rounded-full bg-gray-100">हिंदी / EN</button>
    </header>

    <!-- Main Content (मुख्य हिस्सा) -->
    <main class="p-6 text-center">
        <h2 class="text-3xl font-bold mb-4 mt-6">दुकानदार का स्मार्ट रेट कार्ड</h2>
        <p class="text-gray-600 mb-8">हर आइटम का होलसेल और मंडी रेट, एक ही जगह।</p>

        <!-- Search Bar (खोज बॉक्स) -->
        <div class="max-w-md mx-auto relative">
            <input type="text" placeholder="आटा, चावल, तेल खोजें..." class="w-full p-4 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
            <button class="absolute right-2 top-2 bg-blue-600 text-white p-2 rounded-md">🔍</button>
        </div>
    </main>

    <!-- Categories (श्रेणियाँ) -->
    <section class="p-6 max-w-lg mx-auto">
        <h3 class="text-xl font-semibold mb-4">श्रेणियाँ (Categories)</h3>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-lg shadow text-center font-medium cursor-pointer hover:bg-gray-100">किराना (Grocery)</div>
            <div class="bg-white p-4 rounded-lg shadow text-center font-medium cursor-pointer hover:bg-gray-100">सब्जी-फल (Veggies)</div>
            <div class="bg-white p-4 rounded-lg shadow text-center font-medium cursor-pointer hover:bg-gray-100">डेयरी (Dairy)</div>
            <div class="bg-white p-4 rounded-lg shadow text-center font-medium cursor-pointer hover:bg-gray-100">स्नैक्स (Snacks)</div>
        </div>
    </section>
<script>
    async function checkServer() {
        try {
            const response = await fetch('https://hopdukan.onrender.com/api/health');
            const data = await response.json();
            console.log("सर्वर का जवाब:", data);
        } catch (error) {
            console.error("सर्वर से कनेक्ट नहीं हो पाया:", error);
        }
    }

    const searchInput = document.querySelector('input[type="text"]');
    if (searchInput) {
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                alert('तुमने सर्च किया: ' + searchInput.value + '\n(सर्वर अब जुड़ चुका है!)');
            }
        });
    }

    checkServer();
// टेस्ट बटन का काम
const testAddBtn = document.getElementById('testAddBtn');
if (testAddBtn) {
    testAddBtn.addEventListener('click', async () => {
        try {
            const response = await fetch('https://hopdukan.onrender.com/api/add-item', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name_hi: 'आटा', name_en: 'Flour', wholesale_price: 40 })
            });
            const data = await response.json();
            alert(data.message);
        } catch (error) {
            alert("एरर आया: " + error);
        }
    });
    }

        </script> 
<!-- टेस्टिंग के लिए अस्थायी बटन -->
<button id="testAddBtn" class="bg-green-600 text-white p-3 rounded-lg mt-4 block mx-auto">टेस्ट: आटा जोड़ें (₹40)</button>

</body>
  </html>
